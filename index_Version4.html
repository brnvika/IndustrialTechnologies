<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MVP: Определение дефекта покрытия</title>
  <style>
    :root {
      --bg: #f3f4f6;
      --card: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --border: #e5e7eb;
      --primary: #0f766e;
      --primary-hover: #115e59;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      color: var(--text);
      background: radial-gradient(circle at 20% 0%, #e0f2fe, #f3f4f6 45%),
                  radial-gradient(circle at 100% 100%, #d1fae5, #f3f4f6 50%);
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .card {
      width: min(760px, 100%);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 20px 40px rgba(15, 23, 42, 0.08);
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(24px, 4vw, 32px);
    }

    .subtitle {
      margin: 0 0 20px;
      color: var(--muted);
      font-size: 15px;
    }

    .uploader {
      display: grid;
      grid-template-columns: 220px 1fr;
      gap: 16px;
      align-items: start;
    }

    .preview {
      width: 100%;
      aspect-ratio: 4/3;
      border: 2px dashed #93c5fd;
      border-radius: 14px;
      overflow: hidden;
      display: grid;
      place-items: center;
      color: var(--muted);
      background: #eff6ff;
      text-align: center;
      padding: 10px;
      font-size: 13px;
    }

    .preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .controls {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    input[type="file"] {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      background: #fff;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 12px 14px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      background: var(--primary);
      color: #fff;
      transition: background .2s ease;
    }

    button:hover { background: var(--primary-hover); }
    button:disabled { opacity: .5; cursor: not-allowed; }

    .status {
      min-height: 22px;
      color: var(--muted);
      font-size: 14px;
    }

    .result {
      margin-top: 18px;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      background: #f8fafc;
      display: none;
    }

    .result strong {
      font-size: 18px;
      display: block;
      margin-bottom: 6px;
    }

    .scores {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin-top: 10px;
      font-size: 13px;
    }

    .scores div {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px;
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }

    @media (max-width: 700px) {
      .uploader { grid-template-columns: 1fr; }
      .scores { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <section class="card">
    <h1>Определение дефекта покрытия</h1>
    <p class="subtitle">MVP: загрузите фото дороги и получите тип дефекта.</p>

    <div class="uploader">
      <div class="preview" id="previewBox">
        <span id="previewText">Предпросмотр фото</span>
        <img id="previewImage" alt="Предпросмотр" />
      </div>

      <div class="controls">
        <input id="photoInput" type="file" accept="image/*" />
        <button id="analyzeBtn" type="button">Определить дефект</button>
        <div id="status" class="status"></div>
      </div>
    </div>

    <div id="result" class="result">
      <strong id="label"></strong>
      <div>Уверенность: <span id="confidence"></span></div>
      <div class="scores">
        <div><span>Гололед</span><span id="scoreIce">-</span></div>
        <div><span>Рыхлый снег</span><span id="scoreLoose">-</span></div>
        <div><span>Сугробы</span><span id="scoreDrift">-</span></div>
        <div><span>Снежный вал</span><span id="scoreBank">-</span></div>
        <div><span>Чистая дорога</span><span id="scoreClean">-</span></div>
      </div>
    </div>
  </section>

  <script>
    const photoInput = document.getElementById("photoInput");
    const analyzeBtn = document.getElementById("analyzeBtn");
    const statusEl = document.getElementById("status");

    const previewBox = document.getElementById("previewBox");
    const previewText = document.getElementById("previewText");
    const previewImage = document.getElementById("previewImage");

    const resultBox = document.getElementById("result");
    const labelEl = document.getElementById("label");
    const confidenceEl = document.getElementById("confidence");
    const scoreIceEl = document.getElementById("scoreIce");
    const scoreLooseEl = document.getElementById("scoreLoose");
    const scoreDriftEl = document.getElementById("scoreDrift");
    const scoreBankEl = document.getElementById("scoreBank");
    const scoreCleanEl = document.getElementById("scoreClean");

    photoInput.addEventListener("change", () => {
      resultBox.style.display = "none";
      statusEl.textContent = "";

      const file = photoInput.files && photoInput.files[0];
      if (!file) {
        previewImage.style.display = "none";
        previewText.style.display = "block";
        return;
      }

      const url = URL.createObjectURL(file);
      previewImage.src = url;
      previewImage.style.display = "block";
      previewText.style.display = "none";
      previewBox.style.borderColor = "#34d399";
    });

    analyzeBtn.addEventListener("click", async () => {
      const file = photoInput.files && photoInput.files[0];
      if (!file) {
        statusEl.textContent = "Сначала выберите фото.";
        return;
      }

      analyzeBtn.disabled = true;
      statusEl.textContent = "Анализируем фото...";

      try {
        const form = new FormData();
        form.append("photo", file);

        const response = await fetch("/api/vision/analyze", {
          method: "POST",
          body: form
        });

        if (!response.ok) {
          const err = await response.text();
          throw new Error(err || "Ошибка при анализе");
        }

        const data = await response.json();

        labelEl.textContent = `Дефект: ${data.label}`;
        confidenceEl.textContent = `${Math.round((data.confidence || 0) * 100)}%`;

        scoreIceEl.textContent = Math.round((data.iceScore || 0) * 100) + "%";
        scoreLooseEl.textContent = Math.round((data.looseSnowScore || 0) * 100) + "%";
        scoreDriftEl.textContent = Math.round((data.snowdriftScore || 0) * 100) + "%";
        scoreBankEl.textContent = Math.round((data.snowBankAtCrosswalkScore || 0) * 100) + "%";
        scoreCleanEl.textContent = Math.round((data.cleanRoadScore || 0) * 100) + "%";

        resultBox.style.display = "block";
        statusEl.textContent = "Готово.";
      } catch (error) {
        statusEl.textContent = "Не удалось проанализировать фото.";
      } finally {
        analyzeBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
